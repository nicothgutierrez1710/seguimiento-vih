<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;font-size:13px;color:var(--color-text-primary);background:var(--color-background-primary)}
.ctrl{display:flex;gap:8px;padding:10px 14px;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;align-items:center;background:var(--color-background-primary);position:sticky;top:0;z-index:10}
.ctrl input,.ctrl select{font-size:12px;padding:5px 9px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary);font-family:'DM Mono',monospace}
.ctrl input{flex:1;min-width:150px}
.cnt{font-size:11px;color:var(--color-text-secondary);margin-left:auto}
.bx{padding:5px 11px;font-size:11px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);cursor:pointer;font-family:'DM Mono',monospace;color:var(--color-text-primary)}
.bx:hover{background:var(--color-background-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px;padding:14px}
.ficha{border-radius:12px;overflow:hidden;border:1px solid var(--color-border-tertiary);background:var(--color-background-primary);display:flex;flex-direction:column;cursor:pointer;transition:transform .13s,box-shadow .13s}
.ficha:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,0,0,.09)}
.fh{padding:13px 15px 11px;position:relative}
.fh-si{background:#e8f5ee;border-bottom:2px solid #2d9e5a}
.fh-dl{background:#fff8e1;border-bottom:2px solid #f0b429}
.fh-in{background:#fff0e6;border-bottom:2px solid #e07b39}
.fh-dv{background:#fdeaea;border-bottom:2px solid #c93535}
.fh-vp{background:var(--color-background-secondary);border-bottom:2px solid #ccc}
.ep{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.ep-si{background:#2d9e5a;color:#fff}
.ep-dl{background:#f0b429;color:#fff}
.ep-in{background:#e07b39;color:#fff}
.ep-dv{background:#c93535;color:#fff}
.ep-vp{background:#999;color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.sc{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:6px 0 2px;letter-spacing:-.01em;color:var(--color-text-primary)}
.pr{font-size:10px;color:var(--color-text-secondary);letter-spacing:.02em}
.fb{padding:12px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.al{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ar{display:flex;align-items:center;gap:9px}
.at{flex:1;height:7px;border-radius:999px;background:var(--color-background-secondary);overflow:hidden}
.af{height:100%;border-radius:999px}
.ap{font-size:16px;font-weight:600;min-width:38px;text-align:right;font-family:'Fraunces',serif}
.tl{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.tv{font-size:11px;line-height:1.45;color:var(--color-text-primary)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.ik{font-size:9px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em}
.iv{font-size:11px;color:var(--color-text-primary);font-weight:500}
.db{padding:7px 10px;border-radius:8px;text-align:center}
.db-si{background:#e8f5ee;color:#1a6b3a}
.db-dl{background:#fff8e1;color:#7a5800}
.db-in{background:#fff0e6;color:#8a3800}
.db-dv{background:#fdeaea;color:#7a1a1a}
.dn{font-size:22px;font-weight:600;font-family:'Fraunces',serif;line-height:1}
.dl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;opacity:.8}
.bars{display:flex;align-items:flex-end;gap:3px;height:26px}
.bar{flex:1;border-radius:3px 3px 0 0;min-width:5px}
.ba-alert{font-size:10px;padding:3px 8px;border-radius:4px;background:#fdeaea;color:#7a1a1a;display:inline-block}
.telr{display:flex;align-items:center;gap:6px;padding-top:7px;border-top:0.5px solid var(--color-border-tertiary)}
.teln{font-size:12px;font-weight:500}
.telx{font-size:11px;color:var(--color-text-secondary);font-style:italic}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.mo{background:var(--color-background-primary);border-radius:16px;border:1px solid var(--color-border-tertiary);width:100%;max-width:450px;max-height:88vh;overflow-y:auto}
.moh{padding:16px 18px 13px;border-bottom:0.5px solid var(--color-border-tertiary)}
.mob{padding:14px 18px}
.mof{padding:11px 18px;border-top:0.5px solid var(--color-border-tertiary);display:flex;justify-content:flex-end}
.mr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px}
.mr:last-child{border-bottom:none}
.mk{color:var(--color-text-secondary);font-size:11px}
.mv{text-align:right;font-size:11px;max-width:250px}
.st{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
.empty{text-align:center;padding:60px;color:var(--color-text-secondary);font-size:13px}
.tel-btn{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);cursor:pointer;font-family:'DM Mono',monospace;color:var(--color-text-secondary);transition:all .15s}
.tel-btn:hover{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
.tel-revealed{display:flex;align-items:center;gap:7px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.tel-num-big{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.tel-call{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;text-decoration:none;font-family:'DM Mono',monospace;transition:all .15s;white-space:nowrap}
.tel-call.llamar{background:#e8f5ee;color:#1a6b3a;border:0.5px solid #2d9e5a}
.tel-call.llamar:hover{background:#2d9e5a;color:#fff}
.tel-call.sms{background:#e8f0fb;color:#1a3d8a;border:0.5px solid #4a6dd4}
.tel-call.sms:hover{background:#4a6dd4;color:#fff}
.tel-call.wsp{background:#e8faf0;color:#075e54;border:0.5px solid #25d366}
.tel-call.wsp:hover{background:#25d366;color:#fff}
.tel-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}

function bars(vs){
  if(!vs||vs.length<2)return'';
  const mx=Math.max(...vs.map(v=>v.di||1));
  return'<div class="bars">'+vs.map(v=>{
    const h=Math.max(18,Math.round((v.di/mx)*24));
    return`<div class="bar" style="height:${h}px;background:${VC[v.es]||'#bbb'}" title="${fd(v.fe)} · ${v.di}d"></div>`;

}

function rnd(){
  const bq=nm(document.getElementById('sb').value);
  const fe=document.getElementById('se').value;
  const fp=document.getElementById('sp').value;
  const fs=document.getElementById('sx').value;
  const fil=RP.filter(p=>{
    if(bq&&!nm(p.s).includes(bq)&&!nm(p.co||'').includes(bq))return false;
    if(fe&&p.es!==fe)return false;
    if(fp&&p.pr!==fp)return false;
    if(fs&&p.sx!==fs)return false;
    return true;
  });
  document.getElementById('cnt').textContent=fil.length+' pacientes';
  const g=document.getElementById('grid');
  g.innerHTML=fil.length?fil.map(fH).join(''):'<div class="empty">Sin resultados.</div>';
}
function exp(){

  const csv=[H,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');

}
