<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;font-size:13px;color:var(--color-text-primary);background:var(--color-background-primary)}
.ctrl{display:flex;gap:8px;padding:10px 14px;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;align-items:center;background:var(--color-background-primary);position:sticky;top:0;z-index:10}
.ctrl input,.ctrl select{font-size:12px;padding:5px 9px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary);font-family:'DM Mono',monospace}
.ctrl input{flex:1;min-width:150px}
.cnt{font-size:11px;color:var(--color-text-secondary);margin-left:auto}
.bx{padding:5px 11px;font-size:11px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);cursor:pointer;font-family:'DM Mono',monospace;color:var(--color-text-primary)}
.bx:hover{background:var(--color-background-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px;padding:14px}
.ficha{border-radius:12px;overflow:hidden;border:1px solid var(--color-border-tertiary);background:var(--color-background-primary);display:flex;flex-direction:column;cursor:pointer;transition:transform .13s,box-shadow .13s}
.ficha:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,0,0,.09)}
.fh{padding:13px 15px 11px;position:relative}
.fh-si{background:#e8f5ee;border-bottom:2px solid #2d9e5a}
.fh-dl{background:#fff8e1;border-bottom:2px solid #f0b429}
.fh-in{background:#fff0e6;border-bottom:2px solid #e07b39}
.fh-ip{background:#fdf0e8;border-bottom:2px solid #b94a1a}
.fh-dv{background:#fdeaea;border-bottom:2px solid #c93535}
.fh-vp{background:var(--color-background-secondary);border-bottom:2px solid #ccc}
.ep{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.ep-si{background:#2d9e5a;color:#fff}
.ep-dl{background:#f0b429;color:#fff}
.ep-in{background:#e07b39;color:#fff}
.ep-ip{background:#b94a1a;color:#fff}
.ep-dv{background:#c93535;color:#fff}
.ep-vp{background:#999;color:#fff}
.fh-pr{background:#e8f0fb;border-bottom:2px solid #2563eb}
.ep-pr{background:#2563eb;color:#fff}
.db-pr{background:#e8f0fb;color:#1a3d8a}.fh-ptv{background:#fdf0f5;border-bottom:2px solid #d63384}.ep-ptv{background:#d63384;color:#fff}.db-ptv{background:#fdf0f5;color:#8b1a4a}.ep-cs{background:#0ea5c4;color:#fff;font-size:9px;padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.sc{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:6px 0 2px;letter-spacing:-.01em;color:var(--color-text-primary)}
.pr{font-size:10px;color:var(--color-text-secondary);letter-spacing:.02em}
.fb{padding:12px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.al{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ar{display:flex;align-items:center;gap:9px}
.at{flex:1;height:7px;border-radius:999px;background:var(--color-background-secondary);overflow:hidden}
.af{height:100%;border-radius:999px}
.ap{font-size:16px;font-weight:600;min-width:38px;text-align:right;font-family:'Fraunces',serif}
.tl{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.tv{font-size:11px;line-height:1.45;color:var(--color-text-primary)}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.ik{font-size:9px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em}
.iv{font-size:11px;color:var(--color-text-primary);font-weight:500}
.db{padding:7px 10px;border-radius:8px;text-align:center}
.db-si{background:#e8f5ee;color:#1a6b3a}
.db-dl{background:#fff8e1;color:#7a5800}
.db-in{background:#fff0e6;color:#8a3800}
.db-ip{background:#fdf0e8;color:#7a2a00}
.db-dv{background:#fdeaea;color:#7a1a1a}
.dn{font-size:22px;font-weight:600;font-family:'Fraunces',serif;line-height:1}
.dl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;opacity:.8}
.bars{display:flex;align-items:flex-end;gap:3px;height:26px}
.bar{flex:1;border-radius:3px 3px 0 0;min-width:5px}
.ba-alert{font-size:10px;padding:3px 8px;border-radius:4px;background:#fdeaea;color:#7a1a1a;display:inline-block}
.telr{display:flex;align-items:center;gap:6px;padding-top:7px;border-top:0.5px solid var(--color-border-tertiary)}
.teln{font-size:12px;font-weight:500}
.telx{font-size:11px;color:var(--color-text-secondary);font-style:italic}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;transition:background .3s ease}
.ov.open{display:block;pointer-events:all;background:rgba(0,0,0,.5)}
.mo{position:fixed;top:0;right:0;height:100%;width:100%;max-width:480px;background:#ffffff;border-left:1px solid #e0e0e0;box-shadow:-8px 0 32px rgba(0,0,0,.18);overflow-y:auto;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:201;display:flex;flex-direction:column}
.ov.open .mo{transform:translateX(0)}
.moh{padding:18px 20px 14px;border-bottom:1px solid #e8e8e8;background:#fff;position:sticky;top:0;z-index:1}
.mob{padding:16px 20px;flex:1;background:#fff}
.mof{padding:12px 20px;border-top:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;bottom:0}
.mr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid #eee;font-size:12px;background:#fff}
.mr:last-child{border-bottom:none}
.mk{color:var(--color-text-secondary);font-size:11px}
.mv{text-align:right;font-size:11px;max-width:250px}
.st{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
.empty{text-align:center;padding:60px;color:var(--color-text-secondary);font-size:13px}
.tel-btn{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);cursor:pointer;font-family:'DM Mono',monospace;color:var(--color-text-secondary);transition:all .15s}
.tel-btn:hover{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
.tel-revealed{display:flex;align-items:center;gap:7px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.tel-num-big{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.tel-call{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;text-decoration:none;font-family:'DM Mono',monospace;transition:all .15s;white-space:nowrap}
.tel-call.llamar{background:#e8f5ee;color:#1a6b3a;border:0.5px solid #2d9e5a}
.tel-call.llamar:hover{background:#2d9e5a;color:#fff}
.tel-call.sms{background:#e8f0fb;color:#1a3d8a;border:0.5px solid #4a6dd4}
.tel-call.sms:hover{background:#4a6dd4;color:#fff}
.tel-call.wsp{background:#e8faf0;color:#075e54;border:0.5px solid #25d366}
.tel-call.wsp:hover{background:#25d366;color:#fff}
.tel-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.pg-header{display:flex;align-items:center;gap:14px;padding:10px 16px 8px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}.pg-logo-wrap{flex-shrink:0}.pg-logo{height:44px;width:auto;display:block}.pg-title-wrap{display:flex;flex-direction:column;justify-content:center}.pg-title{font-family:"Fraunces",serif;font-size:16px;font-weight:600;color:var(--color-text-primary);letter-spacing:-.01em;line-height:1.2}.pg-sub{font-size:10px;color:var(--color-text-secondary);margin-top:2px;letter-spacing:.03em}</style>

// Recalcula ds y es en tiempo real usando la fecha del navegador
(function recalcDs(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  function parseFecha(s){if(!s||String(s).length!==10)return null;const[d,m,y]=String(s).split('-');return new Date(y+'-'+m+'-'+d+'T00:00:00');}
  // Umbrales: tail = días desde fin de cobertura (fe+di), no desde fecha de retiro
  function clasEs(tail){if(tail<=0)return'SIN INTERRUPCIÓN';if(tail<=30)return'DESFASAJE LEVE';if(tail<=90)return'INTERRUPCIÓN';if(tail<=180)return'INTERRUPCIÓN PROLONGADA';return'DESVINCULADO';}
  RP.forEach(p=>{
    // Usar fecha de fin de cobertura del último vs (ff = fe + di), no p.ff (fecha de retiro)
    var ffCob=null;
    if(p.vs&&p.vs.length>0){
      var lastV=p.vs[p.vs.length-1];
      if(lastV.ff) ffCob=parseFecha(lastV.ff);
    }
    // Fallback: si no hay vs, usar p.ff como fecha de retiro y estimar con di=30
    if(!ffCob){
      if(!p.ff)return;
      var ffRet=parseFecha(p.ff);
      if(!ffRet)return;
      ffCob=new Date(ffRet.getTime()+30*24*60*60*1000);
    }
    const tail=Math.max(0,Math.floor((hoy-ffCob)/(1000*60*60*24)));
    p.ds=tail; // días sin cobertura (desde fin de cobertura, no desde retiro)
    if(!['PrEP','PTV'].some(t=>t==='PrEP'?p.me&&(p.me.trim()==='Emtricitabina/Tenofovir 200/300mg'||p.me.toUpperCase()==='EMTRICITABINA - TENOFOVIR 200MG - 300MG COMPRIMIDOS UNIDAD'):t==='PTV'&&p.me&&(p.me.includes('Lamivudina suspensión 10mg/ml')||p.me.includes('Zidovudina jarabe 10mg/ml')||p.me.includes('Zidovudina inyectable')||p.me.includes('Nevirapina')||p.me.includes('Raltegravir 100mg')))){
      p.es=clasEs(tail);
    }
  });
})();

function isPrEP(p){
  const me=(p.me||'').trim();
  const PREP_DRUG='Emtricitabina/Tenofovir 200/300mg';
  // PrEP: ONLY Emtricitabina/Tenofovir, no other HIV drug combined
  return me===PREP_DRUG||me.toUpperCase()==='EMTRICITABINA - TENOFOVIR 200MG - 300MG COMPRIMIDOS UNIDAD';
}
function prepEs(p,baseEs){
  return getEsEfect(p);
  return baseEs;
}
function isPTV(p){
  const me=(p.me||"").trim();
  // PTV: contiene cualquiera de estas drogas de profilaxis transmisión vertical
  if(me.includes("Lamivudina suspensión 10mg/ml"))return true;
  if(me.includes("Zidovudina jarabe 10mg/ml"))return true;
  if(me.includes("Zidovudina inyectable"))return true;
  if(me.includes("Nevirapina"))return true;
  if(me.includes("Raltegravir 100mg"))return true;
  return false;
}
function getEsEfect(p){
  if(isPrEP(p))return "PrEP";
  if(isPTV(p))return "PTV";
  return p.es;
}
function labSection(p){
  // Nuevo formato: p.cv, p.cd4, p.fe_lab (un solo resultado, el más reciente)
  var hasNew=p.fe_lab||p.cv||p.cd4!=null;
  if(!p.labs&&!p.lab&&!hasNew)return '';
  // Si tiene nuevo formato, construir entrada sintética
  var entries;
  if(p.labs){entries=p.labs;}
  else if(p.lab){entries=[{date:p.lab_date,vals:p.lab}];}
  else{entries=[];}
  if(hasNew){
    var synVals={};
    if(p.cv)synVals['ARNc']=p.cv;
    if(p.cd4!=null)synVals['CD4+']=String(p.cd4);
    if(p.fe_lab)entries=[{date:p.fe_lab,vals:synVals}].concat(entries);
  }
  if(!entries.length)return '';
  var entries=p.labs||(p.lab?[{date:p.lab_date,vals:p.lab}]:[]);
  if(!entries.length)return '';
  var bg='var(--color-background-secondary)';
  var s1='padding:5px 6px;background:'+bg+';border-radius:6px;font-size:11px;min-width:0';
  var s2='font-size:9px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px';
  var s3='font-weight:600;font-size:11px';
  var s3cd4='font-weight:800;font-size:15px;color:#1a56a0';
  function cell(k,v,isCD4){
    var vs=isCD4?s3cd4:s3;
    return '<div style="'+s1+(isCD4?';border:1.5px solid #1a56a0;background:#eef4fb':'')+'">'+'<div style="'+s2+'">'+k+'</div><div style="'+vs+'">'+v+'</div></div>';
  }
  var out='<div class="st" style="margin-top:14px">Laboratorio</div>';
  for(var ei=0;ei<entries.length;ei++){
    var e=entries[ei];var lb=e.vals||{};var dt=e.date?fd(e.date):'--';
    var cd4val=parseInt(lb['CD4+'])||0;
    var lowCD4=cd4val>0&&cd4val<200;
    var wrapStyle='margin-bottom:6px'+(lowCD4?';padding:8px;background:#fff3f3;border-radius:8px;border:1.5px solid #e53e3e':'');
    out+='<div style="'+wrapStyle+'">';
    out+='<div style="font-size:10px;color:var(--color-text-secondary);margin:0 0 6px;font-weight:600;display:flex;align-items:center;gap:6px">'+dt+(lowCD4?'<span style="background:#e53e3e;color:#fff;font-size:9px;padding:1px 6px;border-radius:4px;font-weight:700">CD4 BAJO</span>':'')+'</div>';
    out+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px">';
    out+=cell('ARN viral',lb.ARNc||'--',false)+cell('ARN log',lb.ARNlog||'--',false)+cell('REL CD4/CD8',lb['RELCD4/CD8']||'--',false);
    out+=cell('CD3+',lb['CD3+']||'--',false)+cell('CD3%',lb['CD3%']||'--',false)+'<div></div>';
    out+=cell('CD4+',lb['CD4+']||'--',true)+cell('CD4%',lb['CD4%']||'--',true)+'<div></div>';
    out+=cell('CD8+',lb['CD8+']||'--',false)+cell('CD8%',lb['CD8%']||'--',false)+'<div></div>';
    out+='</div></div>';
  }
  return out;
}
function rnd(){
  const bq=nm(document.getElementById('sb').value);
  const fe=document.getElementById('se').value;
  const fp=document.getElementById('sp').value;
  const fs=document.getElementById('sx').value;
  const fil=RP.filter(p=>{
    if(bq&&!nm(p.s).includes(bq)&&!nm(p.co||'').includes(bq))return false;
    const esEfectF=getEsEfect(p);
    if(fe&&esEfectF!==fe)return false;
    if(fp&&p.pr!==fp)return false;
    if(fs&&p.sx!==fs)return false;
    return true;
  }).sort((a,b)=>(b.ad||0)-(a.ad||0));
  document.getElementById('cnt').textContent=fil.length+' pacientes';
  const g=document.getElementById('grid');
  g.innerHTML=fil.length?fil.map(fH).join(''):'<div class="empty">Sin resultados.</div>';
}

  const rows=RP.map(p=>{var lb=p.lab||{};return[p.s,p.co||'',p.sx||'',p.fn||'',p.pr||'',p.ep||'',p.tel||'',p.me||'',p.fe||'',p.ff||'',p.ds||0,p.es,p.ad+'%',p.ba,p.b15?'SÍ':'NO',p.nv,p.lab_date||'',lb.ARNc||'',lb.ARNlog||'',lb['CD3+']||'',lb['CD3%']||'',lb['CD4+']||'',lb['CD4%']||'',lb['CD8+']||'',lb['CD8%']||'',lb['RELCD4/CD8']||''];});
  const csv=[H,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');

    "*{box-sizing:border-box;margin:0;padding:0}",
    "body{font-family:monospace;font-size:12px;color:#111;background:#fff;padding:28px 32px}",
    // Header
    ".hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:2.5px solid #1a56a0}",
    ".hdr-left{display:flex;align-items:center;gap:14px}",
    ".hdr-logo{height:52px;width:auto}",
    ".hdr-text{}",
    ".hosp-name{font-size:11.5px;font-weight:700;color:#1a56a0;letter-spacing:.01em;text-transform:uppercase}",
    ".hosp-sub{font-size:9.5px;color:#666;margin-top:2px}",
    ".hdr-right{text-align:right}",
    ".doc-title{font-size:10px;color:#888;margin-bottom:3px}",
    ".emitido{font-size:9px;color:#bbb}",
    // Badge
    ".ep{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;margin-bottom:6px}",
    ".dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.8}",

    "h1{font-size:20px;font-weight:700;margin:4px 0 2px;color:#111}",
    ".prof{font-size:10px;color:#888;margin-bottom:14px}",
    // Sections
    ".sec{font-size:9px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;border-bottom:.5px solid #eee;padding-bottom:3px}",

    ".mr{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:.5px solid #f2f2f2;font-size:11px}",
    ".mr:last-child{border-bottom:none}",
    ".mk{color:#888;font-size:10px;min-width:160px}",
    ".mk::after{content:':';margin-right:6px}",
    ".mv{font-size:11px;font-weight:500;text-align:right}",

    ".ik{color:#888;font-size:10px}",
    ".ik::after{content:':';margin-right:4px}",
    ".iv{font-size:11px;font-weight:500}",

    ".adh-fill{height:100%;border-radius:3px}",
